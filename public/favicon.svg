<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="The Basic Page">
	<title>The Basic Page</title>
	<defs>
		<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#7dd3fc" />
			<stop offset="1" stop-color="#0284c7" />
		</linearGradient>
	</defs>
	<rect width="64" height="64" rx="15" fill="url(#sky)" />
	<!-- The mark, tucked into a tile so it holds up as a browser-tab icon. -->
	<g fill="#ffffff">
		<rect x="17" y="14" width="30" height="27" rx="4" />
		<circle cx="20.75" cy="41" r="3.75" />
		<circle cx="28.25" cy="41" r="3.75" />
		<circle cx="35.75" cy="41" r="3.75" />
		<circle cx="43.25" cy="41" r="3.75" />
	</g>
	<g fill="#0284c7">
		<rect x="22" y="20" width="20" height="4.6" rx="2.3" />
		<rect x="22" y="28.5" width="12" height="3.4" rx="1.7" />
	</g>
</svg>
